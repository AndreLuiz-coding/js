<script>
   // Uma variável const(constante) deve-se ter como declaração um valor que será fixo em todo código. 
   // O TYPEOF é um operador do JavaScript usado para descobrir o tipo de dado que está guardado dentro de uma variável 
   // No JS é permitido criar uma variável sem valor mas apenas com a palavra chave LET.
   // A variável vai ficar com o valor undefined(indefinido) até que coloque algum valor nela.
   // Diferente do python que não aceita declarar variáveis sem valores, o js permite isso. 
   // Com o liveserver a mensagem do CONSOLE deve se abrir com FN+f12! 
   // O método Number.isInteger(), serve para ver se um numero é inteiro, retornando um booleano. 
   // Andre luiz dos santos rodrigues 23/7/2026. 
   
    const fruta = "banana"
    const preco = 3.50
    const levar = true
    let novoValor
    console.log(typeof fruta) // "string" 
    console.log(typeof preco) // number
    console.log(typeof levar) // boolean
    console.log(typeof novoValor) // undefined 
    console.log(Number.isInteger(12)) // true
    console.log(Number.isInteger(3.50)) // false
</script>
