<script>
    // No JS o método NUMBER() é uma CONVERSÃO DE TIPO, faz com que uma variável do tipo string se torne do tipo numero. 
    // No JS um valor de variável com aspas "" são declaradas como do tipo string.
    // Lembrando os comentários no JS com o .HTML devem ser feitos dentro do <script>.
    // Andre luiz dos santos rodrigues 23/07/2026.
   


    const a = "20"
    const b = a * 2 // b = 40 
    const c = a / 2 // c = 10
    const d = a - 2 // d = 18 
    const e = Number(a) + 2 // e = 22
    alert("e: " + e) // exibe o valor de uma variável
</script>
