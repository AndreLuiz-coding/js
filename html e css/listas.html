<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <h1>Exemplos de Listas em HTML</h1>
    <hr>

    <!-- Uso da tag ul e li para uma lista não ordenada -->
    <h3>Lista Não Ordenada (com marcadores)</h3>
    <ul>
        <li>Item A</li>
        <li>Item B</li>
        <li>Item C</li>
    </ul>

    <br> <!-- Quebra de linha para separar as listas -->

    <!-- Uso da tag ol e li para uma lista ordenada -->
    <h3>Lista Ordenada (com numeração)</h3>
    <ol>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ol>

</body>
</html>
