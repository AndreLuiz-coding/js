<!-- Esse é a semântica básica do HTML -->

<!-- Avisa ao navegador que estamos usando a versão mais recente do HTML5 -->
<!DOCTYPE html>
<!-- Abre o documento e define o idioma principal como Português do Brasil -->
<html lang="pt-br">

<!-- Abre a cabeça do site (configurações e informações do sistema) -->
<head>
<!-- Garante que acentos como á, é, ç apareçam corretamente na tela -->
    <meta charset="UTF-8">
</head>

<!-- Abre o corpo do site (tudo o que aparece na tela para o usuário) -->
<body>
<!-- Cria um título principal, grande e em negrito -->
    <h1>Este é um HTML!</h1>
</body>

</html>
