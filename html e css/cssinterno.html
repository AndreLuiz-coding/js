<!-- Exemplo de CSS interno dentro do HTML, sem precisar criar outro arquivo CSS.-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
  
    <meta charset="UTF-8">
  
    <title>Exemplo de HTML com CSS Incorporado</title> <!-- título que fica na aba do navegador -->
  
    <style> /* contém o CSS incorporado que estiliza a página. */
       
       body {
        
        font-family: Arial, sans-serif;
        background-color: #ffffe0; /* Fundo amarelo claro */

        margin: 0;
        padding: 20px;

}

      h1 {
        
        color: #00008b; /* Cor do texto do título: azul escuro */

        text-align: left; /* Alinhamento do texto do título: à esquerda */
}

     p {
      
        color: #8b0000; /* Cor do texto dos parágrafos:vermelho escuro */
        
        line-height: 1.8; /* Altura da linha aumentada para 1.8 */
        
        font-size: 16px; /* Tamanho da fonte dos parágrafos */
}

</style>

</head>

<body>

    <h1>Bem-vindo ao Desenvolvimento Web com CSS</h1>
    
    <p>Esta é uma página de exemplo utilizando HTML e CSS interno/incorporado.</p>

</body>

</html>
